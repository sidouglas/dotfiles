---
- defaults:
    link:
      relink: true
    shell:
      stdin: true
      stdout: true
      stderr: true
- clean:
    - "~"
# Linked twice, on purpose. This first pass has to run before the shell steps:
# they invoke `exists`, which is defined in zshenv, and zsh only picks that up
# once ~/.zshenv is a link. Without it setup_node.zsh silently skips node and
# setup_homebrew.zsh re-runs the Homebrew installer.
- link: &links
    ~/.bash_profile: null
    ~/.bashrc: null
    ~/.wezterm.lua: null
    ~/.boto: null
    ~/.config/zed:
      glob: true
      create: true
      path: config/zed
    ~/.config/karabiner:
      glob: true
      create: true
      path: config/karabiner
    ~/.config/opencode/opencode.json:
      create: true
      path: config/opencode/opencode.json
    ~/.config/yt-dlp/config:
      create: true
      path: config/yt-dlp/config
    ~/.copilot/mcp-config.json:
      create: true
      path: config/copilot/mcp-config.json
    ~/.fzf: null
    ~/.gitconfig: null
    ~/.gitignore_global: null
    ~/.ideavimrc: null
    ~/.nanorc: null
    ~/.profile: null
    ~/.vim: null
    ~/.vimrc: null
    ~/.zlogin: null
    ~/.zprofile: null
    ~/.zsh_custom: null
    ~/.zshenv: null
    # force, not relink: oh-my-zsh (and installers like it) replace this link
    # with a regular file, which relink won't touch. force lets the second link
    # pass below take it back. Anything you want to keep belongs in the repo's
    # zshrc -- a file left at ~/.zshrc is deleted without prompting.
    ~/.zshrc:
      force: true
    ~/Library/Application Support/Code/User/settings.json: vscode/settings.json
    ~/Library/Application Support/Code/User/keybindings.json:
      vscode/keybindings.json
    ~/Library/LaunchAgents/com.simondouglas.yeti-input.plist:
      create: true
      path: config/launchagents/com.simondouglas.yeti-input.plist

- create:
    - ~/downloads
    - ~/.vim/undo-history
- shell:
    # First: setup_homebrew.zsh resolves its Brewfile from $(hostname), so the
    # name has to be settled before it runs or it forks a directory for whatever
    # the name happened to be.
    - ./setup_hostname.zsh
    - ./setup_homebrew.zsh
    # After Homebrew, which supplies the git-secrets binary, and after the link
    # pass above, which puts the secrets.patterns in gitconfig at ~/.gitconfig.
    - ./setup_git_secrets.zsh
    - ./setup_zsh.zsh
    - ./setup_node.zsh
    - ./setup_macos.zsh
    - ./setup_disable_spotlight.zsh

# Second pass, same map by anchor. Third-party installers run from the shell
# steps above can displace links dotbot already made -- oh-my-zsh did exactly
# that to ~/.zshrc. Re-linking last means the repo wins, so a run always ends
# with the links dotbot intended rather than whatever an installer left behind.
- link: *links
